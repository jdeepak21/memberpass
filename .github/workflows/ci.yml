
name: Membrix CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-check:
    name: Code quality, security scan and build
    runs-on: ubuntu-latest

    steps:
      - name: Get project code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan for exposed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code
        run: npm run lint

      - name: Build project
        run: npm run build
